name: Rails CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/building_pages_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: building_pages_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d building_pages_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        # ruby/setup-ruby reads the repository's .ruby-version by default.
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run RuboCop
        run: bin/rubocop

      - name: Run Brakeman
        run: bin/brakeman --no-pager

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag building-pages:ci .
